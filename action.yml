name: 'SolveBeam WordPress.org Plugin Readme Deploy'
description: 'Update the readme.txt and assets of your plugin on WordPress.org without a new release. Touches nothing else.'
author: 'SolveBeam'

branding:
  icon: 'upload-cloud'
  color: 'orange'

inputs:
  username:
    description: >
      WordPress plugin directory Subversion username, remember your username is case sensitive.

      https://developer.wordpress.org/plugins/wordpress-org/how-to-use-subversion/
    required: true
  password:
    description: >
      WordPress plugin directory Subversion password.

      If you need to reset your password, go to [login.wordpress.org](https://login.wordpress.org/).

      https://developer.wordpress.org/plugins/wordpress-org/how-to-use-subversion/
    required: true
  slug:
    description: >
      WordPress plugin slug.

      https://developer.wordpress.org/plugins/wordpress-org/plugin-developer-faq/#what-will-my-plugin-permalink-slug-be
    required: true
  dry-run:
    description: >
      Run the deployment without committing in the WordPress.org Subversion repository.

      The commit command is printed but not executed, all other steps and checks run as usual.
    required: false
    default: 'false'

outputs:
  public-url:
    description: 'Public URL of the plugin on WordPress.org'
    value: ${{ steps.deploy.outputs.public-url }}
  svn-url:
    description: 'Subversion repository URL of the plugin'
    value: ${{ steps.deploy.outputs.svn-url }}
  svn-tag-url:
    description: 'Subversion URL of the deployed tag'
    value: ${{ steps.deploy.outputs.svn-tag-url }}

runs:
  using: 'composite'
  steps:
    - name: Install Subversion
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y subversion

    - name: Install Composer dependencies
      shell: bash
      run: composer install --no-dev --no-interaction --no-progress --prefer-dist --working-dir="${{ github.action_path }}"

    - id: deploy
      run: php ${{ github.action_path }}/deploy.php
      shell: bash
      env:
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_PASSWORD: ${{ inputs.password }}
        INPUT_SLUG: ${{ inputs.slug }}
        INPUT_DRY-RUN: ${{ inputs.dry-run }}
